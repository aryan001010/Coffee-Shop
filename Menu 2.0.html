<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffee Shop Menu</title>
  <link rel="stylesheet" href="c.css">
  <style>
   
  </style>
</head>
<body>

  <h1>Our Coffee, Snacks & Drinks Menu</h1>

  <div class="tabs">
    <button onclick="filterCategory('all', event)" class="active">All</button>
    <button onclick="filterCategory('coffee', event)">Coffee</button>
    <button onclick="filterCategory('snack', event)">Snacks</button>
    <button onclick="filterCategory('drink', event)">Drinks</button>
  </div>

  <div class="container">
    <div class="menu" id="menu"></div>
    <div class="cart">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div class="cart-total" id="cart-total">Total: ₹0</div>
      <button class="order-button" onclick="placeOrder()">Order Now</button>
    </div>
  </div>

  <script>
    const items = [
      { name: "Espresso", price: 208, category: "coffee", img:"image/e.jpeg"},
      { name: "Latte", price: 291, category: "coffee", img: "image/1.jpeg" },
      { name: "Cappuccino", price: 311, category: "coffee", img: "image/2.jpeg" },
      { name: "Mocha", price: 332, category: "coffee", img:"image/10.jpeg" },
      { name: "Blueberry Muffin", price: 187, category: "snack", img: "image/3.webp" },
      { name: "Croissant", price: 229, category: "snack", img: "image/33.jpg" },
      { name: "Banana Bread", price: 208, category: "snack", img: "image/8.jpeg" },
      { name: "Choco Chip Cookie", price: 146, category: "snack", img: "image/9.jpg" },
      { name: "Iced Tea", price: 208, category: "drink", img: "image/6.jpg" },
      { name: "Strawberry Smoothie", price: 328, category: "drink", img: "image/7.jpg" },
      { name: "Hot Chocolate", price: 270, category: "drink", img: "image/4.jpeg" },
    ];

    const cart = {};

    function renderMenu(filter = 'all') {
      const menu = document.getElementById('menu');
      menu.innerHTML = '';
      items.filter(item => filter === 'all' || item.category === filter).forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <img src="${item.img}" alt="${item.name}" />
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-price">₹${item.price}</div>
            <button onclick="addToCart('${item.name}')">Add to Cart</button>
          </div>
        `;
        menu.appendChild(card);
      });
    }

    function filterCategory(category, event) {
      document.querySelectorAll('.tabs button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderMenu(category);
    }

    function addToCart(name) {
      if (!cart[name]) {
        const item = items.find(i => i.name === name);
        cart[name] = { ...item, quantity: 1 };
      } else {
        cart[name].quantity++;
      }
      renderCart();
    }

    function changeQuantity(name, amount) {
      if (cart[name]) {
        cart[name].quantity += amount;
        if (cart[name].quantity <= 0) delete cart[name];
        renderCart();
      }
    }

    function renderCart() {
      const cartItems = document.getElementById('cart-items');
      const total = document.getElementById('cart-total');
      cartItems.innerHTML = '';
      let sum = 0;
      for (let name in cart) {
        const item = cart[name];
        sum += item.quantity * item.price;
        cartItems.innerHTML += `
          <div class="cart-item">
            <span>${item.name} (₹${item.price})</span>
            <div>
              <button onclick="changeQuantity('${item.name}', -1)">-</button>
              <input type="text" value="${item.quantity}" readonly>
              <button onclick="changeQuantity('${item.name}', 1)">+</button>
              <button onclick="changeQuantity('${item.name}', -${item.quantity})">Remove</button>
            </div>
          </div>
        `;
      }
      total.innerText = `Total: ₹${sum}`;
    }

    function placeOrder() {
      alert('Thank you for your order!');
      for (let name in cart) delete cart[name];
      renderCart();
    }

    renderMenu();
  </script>

</body>
</html>
